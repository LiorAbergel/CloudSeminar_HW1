<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serverless Chatbot</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <main>
    <h1>Serverless Chatbot</h1>
    <div id="chat"></div>
    <form id="chat-form">
      <input id="prompt" type="text" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>

    <section id="stats">
      <h2>Response times (ms)</h2>
      <p>Average total request: <b id="avgTotal">0</b> ms ·
         Average OpenAI API: <b id="avgOpenai">0</b> ms</p>
      <canvas id="timesChart" height="140"></canvas>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
